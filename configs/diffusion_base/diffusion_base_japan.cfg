# ============================================================
# Diffusion Base 学習設定 (日本地形データ用)
#
# 前提: autoencoder_japan の学習・保存と
#       build-encoded-dataset の実行が完了していること。
#
# build-encoded-dataset の実行コマンド:
#   python -m terrain_diffusion.data.preprocessing.build_encoded_dataset \
#       --dataset data/japan_dataset.h5 \
#       --resolution 90 \
#       --encoder ./checkpoints/models/autoencoder_japan \
#       --use-fp16 \
#       --compile-model \
#       --residual-mean 0.4429 \
#       --residual-std 2.4116 \
#       --overwrite
# ============================================================

[trainer]
@trainer=diffusion

[logging]
save_dir="checkpoints/diffusion_base_japan"
save_epochs=50
temp_save_epochs=1
mean_length=1024

[training]
batch_size=32
gradient_accumulation_steps=1
mixed_precision=fp16
epochs=500
epoch_steps=1024
seed=74
P_mean=-0.6
P_std=1.3

[evaluation]
P_mean=-0.6
P_std=1.3
validate_epochs=10
validation_steps=8192
kid_n_images=512
kid_scheduler_steps=12
kid_batch_size=16
kid_autoencoder_path=null
mode=null

[optimizer]
type=adam
kwargs={"betas": [0.9, 0.99]}

[scheduler]
@scheduler=edm_dpm
sigma_min=0.002
sigma_max=80
sigma_data=0.5

[ema]
sigma_rels=[0.05, 0.1]
update_every=1
checkpoint_every_num_steps=1024

[wandb]
project="generative_land_japan"
tags=["japan", "diffusion_base"]
mode=online
save_code=true

[model]
@model=unet
image_size=512
in_channels=5
out_channels=5
model_channels=128
model_channel_mults=[1, 2, 3, 4]
layers_per_block=2
emb_channels=null
noise_emb_dims=null
attn_resolutions=[8, 16]
midblock_attention=true
concat_balance=0.5
conditional_inputs=[["tensor", 58, 1.0]]
fourier_scale="pos"
block_kwargs={"dropout": 0.1}

[lr_sched]
@lr_sched=sqrt
lr=0.005
ref_nimg=1310720
warmup_nimg=107495

[train_dataset]
@dataset=h5_latents
h5_file="data/japan_dataset.h5"
crop_size=64
pct_land_ranges=[[0, 1]]
subset_resolutions=[90]
subset_weights=[1]
latents_mean=[0, 0, 0, 0]
latents_std=[1, 1, 1, 1]
sigma_data=0.5
beauty_dist=[false]
split="train"
residual_mean=0.4429
residual_std=2.4116
cond_input_dropout=0.2
cond_input_max_noise=0.1
cond_input_mean=[10.22, 4.43, 12.0, 700.0, 1700.0, 70.0, 0.80]
cond_input_std=[7.58, 6.45, 1.0, 1.0, 1.0, 1.0, 0.25]

[val_dataset]
@dataset=h5_latents
h5_file="data/japan_dataset.h5"
crop_size=64
pct_land_ranges=[[0, 1]]
subset_resolutions=[90]
subset_weights=[1]
latents_mean=[0, 0, 0, 0]
latents_std=[1, 1, 1, 1]
sigma_data=0.5
beauty_dist=[false]
split="val"
residual_mean=0.4429
residual_std=2.4116
cond_input_dropout=0.2
cond_input_max_noise=0.1
cond_input_mean=[10.22, 4.43, 12.0, 700.0, 1700.0, 70.0, 0.80]
cond_input_std=[7.58, 6.45, 1.0, 1.0, 1.0, 1.0, 0.25]
val_dset=true

[dataloader_kwargs]
num_workers=8
persistent_workers=true
pin_memory=true
pin_memory_device=cuda
prefetch_factor=2
