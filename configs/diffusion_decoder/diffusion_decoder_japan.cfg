# ============================================================
# Diffusion Decoder 学習設定 (日本地形データ用)
#
# 前提: autoencoder_japan の学習と encode ステップが完了していること。
#       latents_mean / latents_std は encode 後に HDF5 から読み取った値を使う。
#
# 注意:
#  - residual_mean / residual_std を build_japan_dataset.py の出力値に更新
#  - latents_mean / latents_std を build_encoded_dataset.py の出力値に更新
# ============================================================

[trainer]
@trainer=diffusion

[logging]
save_dir="checkpoints/diffusion_decoder_japan"
save_epochs=50
temp_save_epochs=1
mean_length=1024

[training]
batch_size=32
gradient_accumulation_steps=1
mixed_precision=fp16
epochs=500
epoch_steps=1024
seed=74
P_mean=0.0
P_std=1.5

[evaluation]
P_mean=0.0
P_std=1.5
validate_epochs=10
validation_steps=8192
kid_n_images=512
kid_scheduler_steps=12
kid_batch_size=32
mode=decoder

[optimizer]
type=adam
kwargs={"betas": [0.9, 0.99]}

[scheduler]
@scheduler=edm_dpm
sigma_min=0.002
sigma_max=80
sigma_data=0.5

[ema]
sigma_rels=[0.05, 0.1]
update_every=1
checkpoint_every_num_steps=5120

[wandb]
project="generative_land_japan"
tags=["japan", "diffusion_decoder"]
mode=online
save_code=true

[model]
@model=unet
image_size=512
in_channels=5
out_channels=1
model_channels=64
model_channel_mults=[1, 2, 3, 4]
layers_per_block=3
emb_channels=null
noise_emb_dims=null
attn_resolutions=[]
midblock_attention=false
concat_balance=0.5
conditional_inputs=[]
fourier_scale="pos"

[lr_sched]
@lr_sched=sqrt
lr=0.01
ref_nimg=1310720
warmup_nimg=327680

[train_dataset]
@dataset=h5_decoder_terrain
h5_file="data/japan_dataset.h5"
crop_size=128
pct_land_ranges=[[0, 0.01], [0.01, 1]]
subset_resolutions=[90, 90]
subset_weights=[0.01, 0.99]
split="train"
sigma_data=0.5
# ★ build_japan_dataset.py の出力値に更新してください
residual_mean=0.0
residual_std=1.1678

[val_dataset]
@dataset=h5_decoder_terrain
h5_file="data/japan_dataset.h5"
crop_size=128
pct_land_ranges=[[0, 0.01], [0.01, 1]]
subset_resolutions=[90, 90]
subset_weights=[0.01, 0.99]
split="val"
sigma_data=0.5
# ★ build_japan_dataset.py の出力値に更新してください
residual_mean=0.0
residual_std=1.1678

[dataloader_kwargs]
num_workers=8
persistent_workers=true
pin_memory=true
prefetch_factor=4
