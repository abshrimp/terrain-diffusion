# ============================================================
# Autoencoder 学習設定 (日本地形データ用)
#
# 注意: 学習前に build_japan_dataset.py を実行し、
#       出力された residual_std の値をここに設定してください。
# ============================================================

[trainer]
@trainer=autoencoder

[logging]
save_dir="checkpoints/autoencoder_japan"
save_epochs=5
temp_save_epochs=1
mean_length=1024

[training]
batch_size=32
gradient_accumulation_steps=1
gradient_clip_val=5
mixed_precision=fp16
epochs=150
epoch_steps=1024
kl_weight=0.05
mae_weight=0.5
perceptual_weight=0.5
seed=74

[evaluation]
validate_epochs=5
validation_steps=8192

[optimizer]
type=adam
kwargs={"betas": [0.9, 0.99]}

[ema]
sigma_rels=[0.05, 0.1]
update_every=1
checkpoint_every_num_steps=1024

[wandb]
project="generative_land_japan"
tags=["japan", "autoencoder"]
mode=online
save_code=true

[model]
@model=autoencoder
image_size=512
in_channels=1
out_channels=1
model_channels=64
model_channel_mults=[1, 2, 4, 4]
layers_per_block=2
emb_channels=null
noise_emb_dims=0
custom_cond_emb_dims=null
attn_resolutions=[]
midblock_attention=false
concat_balance=0.5
latent_channels=4
conditional_inputs=[]
direct_skips=[]

[lr_sched]
@lr_sched=sqrt
lr=0.01
ref_nimg=131072
warmup_nimg=131072

[train_dataset]
@dataset=h5_autoencoder
h5_file="data/japan_dataset.h5"
crop_size=128
# 日本データは海洋専用チャンクがほぼ存在しないため単一サブセットで全チャンクを使用
pct_land_ranges=[[0, 1]]
subset_resolutions=[90]
subset_weights=[1]
split="train"
residual_mean=0.4429
residual_std=2.4116

[val_dataset]
@dataset=h5_autoencoder
h5_file="data/japan_dataset.h5"
crop_size=128
pct_land_ranges=[[0, 1]]
subset_resolutions=[90]
subset_weights=[1]
split="val"
residual_mean=0.4429
residual_std=2.4116

[dataloader_kwargs]
num_workers=8
pin_memory=true
prefetch_factor=2
persistent_workers=true

[sweep]
min_ema_sigma=0.015
max_ema_sigma=0.25
